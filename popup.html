<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TestPilot AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      width: 320px;
      min-height: 300px;
      background: #101114;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .logo {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .status {
      font-size: 11px;
      color: #55d69e;
    }

    .card {
      padding: 15px;
      background: #1b1d22;
      border: 1px solid #292c33;
      border-radius: 13px;
      margin-bottom: 14px;
    }

    .label {
      color: #9297a3;
      font-size: 11px;
      margin-bottom: 8px;
    }

    .description {
      font-size: 13px;
      line-height: 1.5;
      color: #d5d7dc;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #f0f0f0;
      color: #111;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button:active {
      opacity: 0.8;
    }

    #result {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: #d5d7dc;
      font-size: 12px;
      line-height: 1.5;
      max-height: 130px;
      overflow-y: auto;
      margin: 0;
    }

    .footer {
      text-align: center;
      margin-top: 17px;
      color: #666b75;
      font-size: 10px;
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="logo">TestPilot AI</div>
    <div class="status">● SYSTEM READY</div>
  </div>

  <div class="card">
    <div class="label">AI ASSISTANT</div>
    <div class="description">
      Помощник для анализа учебных страниц и объяснения заданий.
    </div>
  </div>

  <button id="start">Анализировать страницу</button>

  <div class="card" style="margin-top: 14px;">
    <div class="label">РЕЗУЛЬТАТ АНАЛИЗА</div>
    <pre id="result">Ожидание запуска...</pre>
  </div>

  <div class="footer">
    TESTPILOT AI · VERSION 1.0
  </div>

  <script src="popup.js"></script>

</body>
</html>
