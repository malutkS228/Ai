<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TestPilot AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  width: 320px;
  background: #101318;
  color: white;
  font-family: Arial, sans-serif;
  padding: 20px;
}

.header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 25px;
}

.logo {
  width: 38px;
  height: 38px;
  background: #3978ff;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-size: 22px;
}

h2 {
  margin: 0;
  font-size: 19px;
}

.status {
  color: #50d69a;
  font-size: 12px;
  margin-top: 5px;
}

.card {
  background: #1c222c;
  border-radius: 14px;
  padding: 15px;
  margin-bottom: 15px;
}

.card p {
  color: #aab3c2;
  font-size: 13px;
}

button {
  width: 100%;
  border: none;
  padding: 14px;
  border-radius: 11px;
  background: #3978ff;
  color: white;
  font-weight: bold;
  font-size: 14px;
}

.footer {
  text-align: center;
  color: #687386;
  font-size: 11px;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">✦</div>
  <div>
    <h2>TestPilot AI</h2>
    <div class="status">● SYSTEM READY</div>
  </div>
</div>

<div class="card">
  <strong>AI Assistant</strong>
  <p>Помощник для анализа учебных материалов.</p>
</div>

<div class="card">
  <strong>Возможности</strong>
  <p>• Определение предмета</p>
  <p>• Определение темы</p>
  <p>• Объяснение заданий</p>
  <p>• Анализ учебных материалов</p>
</div>

<button id="start">Начать анализ</button>

<div class="footer">
  TESTPILOT AI · VERSION 1.0
</div>

</body>
</html>
